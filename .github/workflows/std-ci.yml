name: std CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".agents/context/**"
      - "eng/scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "std/release.json"
      - "std/**"
      - "vite.config.ts"
  push:
    paths:
      - ".github/workflows/**"
      - ".agents/context/**"
      - "eng/scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "std/release.json"
      - "std/**"
      - "vite.config.ts"
  schedule:
    - cron: "17 3 * * 1"
    - cron: "17 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: std CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26.x

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.6.0
          standalone: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: latest

      - name: Show tool versions
        shell: bash
        run: |
          node --version
          pnpm --version
          bun --version
          deno --version

      - name: Install dependencies
        shell: bash
        run: pnpm --package=vite-plus@0.1.24 dlx vp install --frozen-lockfile

      - name: Select std packages
        id: packages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node eng/scripts/select-std-packages.mjs --mode ci

      - name: Check std packages
        if: steps.packages.outputs.packages != ''
        shell: bash
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: node eng/scripts/run-std-package-tasks.mjs --task check

      - name: Run std Node tests
        if: steps.packages.outputs.packages != ''
        shell: bash
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: node eng/scripts/run-std-package-tasks.mjs --task node-test

      - name: Run std Bun tests
        if: steps.packages.outputs.packages != ''
        shell: bash
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: node eng/scripts/run-std-package-tasks.mjs --task bun-test

      - name: Run std Deno tests
        if: steps.packages.outputs.packages != ''
        shell: bash
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: node eng/scripts/run-std-package-tasks.mjs --task deno-test

      - name: Audit dependencies
        shell: bash
        run: pnpm audit --audit-level high
