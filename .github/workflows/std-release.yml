name: std Release

on:
  push:
    tags:
      - "std/v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package path to dry-run, for example std/chars, std/slices, or all. Tags always select all std packages."
        required: false
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: std-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: std release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.6.0
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: latest

      - name: Install dependencies
        shell: bash
        run: pnpm --package=vite-plus@0.1.24 dlx vp install --frozen-lockfile

      - name: Select packages
        id: packages
        shell: bash
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          REF_NAME: ${{ github.ref_name }}
        run: node eng/scripts/select-std-packages.mjs --mode release

      - name: Audit dependencies
        shell: bash
        run: pnpm audit --audit-level high

      - name: Release dry run
        shell: bash
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: node eng/scripts/run-std-package-tasks.mjs --task release-dry-run

      - name: Publish packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/std/v')
        shell: bash
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: node eng/scripts/run-std-package-tasks.mjs --task release-publish
